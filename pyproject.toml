[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apneaguard"
version = "0.1.0"
description = "Sleep-apnea detection and severity-scoring system"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.pytest.ini_options]
addopts = "--cov=src --cov=api --cov-report=term-missing"
testpaths = [
    "tests",
]

[tool.coverage.run]
omit = [
    "src/preprocessing/visual_qc.py",
]
