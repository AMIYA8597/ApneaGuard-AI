version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/owner/apneaguard-ai:latest
    container_name: apneaguard-api
    restart: always
    ports:
      - "80:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/apneaguard
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: apneaguard-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apneaguard
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_prod:
